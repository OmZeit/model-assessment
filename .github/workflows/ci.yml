name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  pixi-test:
    name: Pixi tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          environments: dev
          manifest-path: assayready/pixi.toml
      - name: Environment check
        working-directory: assayready
        run: pixi run --environment dev doctor
      - name: Test suite
        working-directory: assayready
        run: pixi run --environment dev test
      - name: Public audit smoke test
        if: runner.os == 'Linux'
        working-directory: assayready
        run: pixi run --environment dev smoke

  package-test:
    name: Package test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Environment check
        run: assayready doctor
      - name: Test suite
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip uninstall -y assayready
          python -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/assayready/tests/installed_wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: assayready-distributions
          path: dist/*

  base-install-test:
    name: Lightweight base install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify optional modeling dependencies are absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('tokenizers') is None"
      - name: Base environment check
        run: assayready doctor
      - name: Prediction-audit smoke test without modeling extras
        run: assayready audit-predictions --config assayready/model_assessment/examples/public_dream_promoter_audit.json
      - name: UI import smoke test
        run: python -c "import model_assessment.ui"

  supply-chain:
    name: Dependency audit and SBOM
    needs: package-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[security]"
      - name: Dependency audit
        run: pip-audit
      - name: Create SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: assayready-sbom
          path: sbom.json
