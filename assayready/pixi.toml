[workspace]
name = "assayready"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
pip = "*"
setuptools = ">=77"
dash = ">=4.2,<5"
dash-ag-grid = ">=35.3,<36"
numpy = ">=2.4,<2.6"
pandas = ">=3.0,<3.1"
plotly = ">=6.0,<7"
openpyxl = ">=3.1,<3.2"
scikit-learn = ">=1.9,<2"
pyyaml = ">=6.0,<7"
rapidfuzz = ">=3.14,<4"

[feature.modeling.dependencies]
pytorch-cpu = ">=2.12,<2.13"
tokenizers = ">=0.22,<0.24"

[feature.modeling]
platforms = ["win-64", "linux-64"]

[feature.dev.dependencies]
python-build = ">=1.3,<2"
pytest = ">=9.0.3,<10"

[feature.dev.pypi-dependencies]
pip-audit = ">=2.9,<3"
cyclonedx-bom = ">=7,<8"

[pypi-dependencies]
assayready = { path = ".", editable = false }

[environments]
default = { features = ["modeling", "dev"], solve-group = "modeling" }
assayready = { features = [], solve-group = "core" }
modeling = { features = ["modeling"], solve-group = "modeling" }
dev = { features = ["modeling", "dev"], solve-group = "modeling" }

[tasks]
install-requirement = "python -m pip install --no-deps --no-build-isolation -r requirement.txt"
ui = "assayready-ui --host 127.0.0.1 --port 8050"
smoke = "python -m model_assessment.cli audit-predictions --config model_assessment/examples/public_dream_promoter_audit.json"
doctor = "assayready doctor"
test = "pytest"
audit = "pip-audit"
sbom = "cyclonedx-py environment -o sbom.json"
