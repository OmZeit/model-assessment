[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "model-assessment"
version = "0.1.0"
description = "Local assay audit, similarity-aware benchmark, and candidate-ranking toolkit for sequence-function data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dash>=4.2,<5",
    "numpy>=2.4,<2.6",
    "openpyxl>=3.1,<3.2",
    "pandas>=3.0,<3.1",
    "plotly>=6.0,<7",
    "PyYAML>=6.0,<7",
    "rapidfuzz>=3.14,<4",
    "scikit-learn>=1.9,<2",
    "tokenizers>=0.22,<0.24",
    "torch>=2.12,<2.13",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=9.0.3,<10",
]
foundation-models = [
    "peft>=0.15,<1",
    "transformers>=4.50,<5",
]
security = [
    "cyclonedx-bom>=7,<8",
    "pip-audit>=2.9,<3",
]

[project.scripts]
assayready = "model_assessment.cli:main"
assayready-ui = "model_assessment.ui_launcher:main"
model-assessment = "model_assessment.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_assessment*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
model_assessment = [
    "assets/*.css",
    "examples/*",
    "data_core/bpe_vocab/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "performance: bounded runtime and memory regression checks",
]
