name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  pixi-test:
    name: Pixi tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Environment check
        run: pixi run doctor
      - name: Test suite
        run: pixi run test
      - name: Public audit smoke test
        if: runner.os == 'Linux'
        run: pixi run smoke

  package-test:
    name: Package test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Environment check
        run: assayready doctor
      - name: Test suite
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m pip uninstall -y model-assessment
          python -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/tests/installed_wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: assayready-distributions
          path: dist/*

  supply-chain:
    name: Dependency audit and SBOM
    needs: package-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Create SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: assayready-sbom
          path: sbom.json
